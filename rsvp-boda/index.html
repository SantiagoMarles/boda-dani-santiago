<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boda Daniela y Santiago · Confirma tu asistencia</title>
  <meta name="description" content="Confirma tu asistencia a la boda de Daniela y Santiago." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="boda">
    <div class="boda-fondo">
      <img class="boda-foto" src="assets/pareja.jpeg" alt="Daniela y Santiago caminando de la mano" />
      <div class="boda-overlay"></div>
    </div>

    <div class="boda-contenido">
      <header class="boda-encabezado">
        <p class="boda-fecha">Nos casamos</p>
        <h1 class="boda-titulo">Boda Daniela y Santiago</h1>
        <p class="boda-subtitulo">Confirma tu asistencia</p>
      </header>

      <!-- Tarjeta 1: buscador -->
      <section class="boda-tarjeta" id="tarjetaBuscador">
        <label class="rsvp-label" for="buscarNombre">Escribe tu nombre</label>
        <div class="rsvp-buscador">
          <input type="text" id="buscarNombre" class="rsvp-input" placeholder="Ej. Karen Romero" autocomplete="off" />
          <ul id="listaSugerencias" class="rsvp-sugerencias" hidden></ul>
        </div>
        <p id="ayudaBusqueda" class="rsvp-ayuda">Escribe al menos 2 letras de tu nombre o el de tu familia.</p>
        <p id="errorBusqueda" class="rsvp-error" hidden>No encontramos ese nombre. Verifica cómo lo escribiste.</p>
      </section>

      <!-- Tarjeta 2: grupo familiar -->
      <section class="boda-tarjeta" id="tarjetaFormulario" hidden>
        <div class="rsvp-invitado">
          <p class="rsvp-invitado-nombre" id="nombreGrupo"></p>
          <button type="button" class="rsvp-enlace" id="btnCambiarBusqueda">Cambiar</button>
        </div>
        <p class="rsvp-contador" id="contadorPersonas"></p>

        <ul class="rsvp-personas" id="listaPersonas"></ul>

        <div class="rsvp-acciones">
          <button type="button" class="rsvp-btn rsvp-btn-fantasma" data-decision="no">No podremos asistir</button>
          <button type="button" class="rsvp-btn rsvp-btn-primario" data-decision="si">Sí asistiremos</button>
        </div>
      </section>

      <!-- Tarjeta 3: mensaje final -->
      <section class="boda-tarjeta boda-mensaje" id="tarjetaMensaje" hidden>
        <h2 id="tituloMensaje"></h2>
        <p id="textoMensaje"></p>
      </section>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div class="modal" id="modalConfirmar" hidden>
    <div class="modal-caja">
      <p class="modal-titulo" id="modalTitulo"></p>
      <p class="rsvp-error" id="modalError" hidden></p>
      <div class="modal-acciones">
        <button type="button" class="rsvp-btn rsvp-btn-fantasma" id="btnCancelarModal">Cancelar</button>
        <button type="button" class="rsvp-btn rsvp-btn-primario" id="btnConfirmarModal">Sí, confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
